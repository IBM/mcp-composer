[project]
name = "mcp-composer"
dynamic = ["version"]                      # <- dynamic version comes from tags in git
description = "FastMCP-based MCP Server Orchestrator"
readme = { file = "PACKAGE.md", content-type = "text/markdown" }
license = "Apache-2.0"
authors = [
    { name = "Mansura Habiba" },
]
requires-python = ">=3.11, <3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "mcp", "mcp server", "mcp client", "mcp developer kit",
    "model context protocol", "llm", "agent",
]
dependencies = [
    "fastmcp==3.4.7",
    "requests==2.33.1",
    "httpx==0.28.1",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.12.0",
    "aiohttp==3.14.3",
    "jsonschema>=4.24.0",
    "uncurl==0.0.11",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "types-requests>=2.32.4.20250611",
    "jsonref>=1.1.0",
    "deepdiff>=8.6.1",
    "typer>=0.17.0",
    "python-daemon>=3.1.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "rich>=13.7",
    "cryptography>=46.0.6",
    "protobuf>=6.33.5",
    "jaraco-context>=6.1.0",
    "pyasn1>=0.6.2",
    "filelock>=3.20.3",
    "packaging>=24.0",
    "sentence-transformers==6.1.0",
    "a2a-sdk==0.3.26",
    "asyncpg>=0.29.0",
    "numpy==2.4.4",
    "pandas==3.0.6",
    "authlib==1.7.1",
    "boto3>=1.34.0",
    "python-multipart==0.0.32",
    "urllib3>=2.8.0"
]

[project.urls]
Documentation = "https://ibm.github.io/mcp-composer/"
Repository = "https://github.com/ibm/mcp-composer"

[dependency-groups]
dev = [
    "dirty-equals==0.11",
    "pylint>=3.3.7",
    "pytest==8.3.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-flakefinder",
    "pytest-report==0.2.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff",
    "pre-commit",
    "black==26.3.1",
    "mypy==1.20.2",
    "coverage==7.16.2",
    "bandit==1.9.4",
    "twine==7.0.0",
    "debugpy>=1.8.16",
    "detect-secrets>=1.5.0"
]

[project.optional-dependencies]
# Existing optional dependencies
tracing = [
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp>=1.39.0",
]


# Secrets management
secrets = [
    "hvac==2.4.0",  # HashiCorp Vault
]

# AI/ML features
ai = [
    "google-genai==2.28.0",
    "litellm==1.83.0",
    "ollama>=0.6.1",
    "scikit-learn>=1.7.1"
]


# Search functionality
search = [
    "duckduckgo-search>=6.3.0",
]


# All optional features
all = [
    "mcp-composer[tracing,secrets,ai,search]",
]

[project.scripts]
mcp-composer = "mcp_composer.core.cli.cli_main:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
# Tags look like mcp_composer-v0.2.1
pattern = 'mcp_composer-v(?P<base>\d+\.\d+\.\d+)'
fallback_version = "0.0.0"
# --- key bits to avoid "+<hash>" ---
style = "pep440"        # ensure PEP 440 shape
metadata = false        # DO NOT add local metadata (commit hash, dirty flag)
dirty = false           # belt & braces



# Wheel build (src-layout)
[tool.hatch.build.targets.wheel]
package-dir = {"" = "src"}
# Remove explicit packages list to auto-discover all packages
exclude = ["**/.venv/**", "**/__pycache__/**", "tests/**", "build/**", "dist/**", ".git/**"]

# Also exclude junk from sdist
[tool.hatch.build.targets.sdist]
exclude = ["**/.venv/**", "**/__pycache__/**", "build/**", "dist/**", ".git/**"]

# --- Tooling configs (unchanged) ---
[tool.pyright]
include = ["src", "test"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", ".git", "dist"]
venvPath = "."
venv = ".venv"

[tool.pylint.'MAIN']
ignore = ["venv", "migrations", "build"]
max-line-length = 120
disable = ["C0114", "C0115", "C0116"]

[tool.pylint.messages_control]
disable = ["missing-docstring", "invalid-name"]

[tool.ruff]
line-length = 120
exclude = ["venv", "migrations", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "build/"]
warn_return_any = false
warn_unused_ignores = false
no_implicit_optional = false
strict_optional = false

[[tool.mypy.overrides]]
module = [
    "ibm_cloud_sdk_core.*",
    "ibm_secrets_manager_sdk.*",
    "bs4.*",
    "sklearn.*",
    "uncurl.*",
    "jsonref.*",
    "daemon.*",
    "github.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end tests that need a running server",
]

[tool.coverage.run]
branch = true
source = ["src/mcp_composer"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true

[tool.mcp_composer]
tracing_enabled = false
tracing_protocol = "http"
tracing_endpoint = "http://localhost:4318"
service_name = "mcp-composer"
environment = "dev"
