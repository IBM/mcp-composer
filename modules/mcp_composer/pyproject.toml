[project]
name = "mcp-composer"
dynamic = ["version"]                      # <- dynamic version comes from tags in git
description = "FastMCP-based MCP Server Orchestrator"
readme = { file = "PACKAGE.md", content-type = "text/markdown" }
requires-python = ">=3.11"
keywords = [
    "mcp", "mcp server", "mcp client", "mcp developer kit",
    "ibm", "model context protocol", "llm", "agent",
]
dependencies = [
    "fastmcp==2.11.3",
    "requests==2.32.4",
    "httpx==0.28.1",
    "ibmcloudant==0.10.2",
    "ibm-cloud-sdk-core==3.23.0",
    "aiohttp==3.12.14",
    "dotenv>=0.9.9",
    "jsonschema>=4.24.0",
    "uncurl==0.0.11",
    "ibm-secrets-manager-sdk==2.1.10",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "hvac==2.3.0",
    "types-requests>=2.32.4.20250611",
    "jsonref>=1.1.0",
    "deepdiff>=8.6.1",
    "scikit-learn>=1.7.1",
    "typer>=0.17.0",
    "python-daemon>=3.1.2",
]

[project.urls]
Documentation = "https://ibm.github.io/mcp-composer/"
Repository = "https://github.com/ibm/mcp-composer"

[dependency-groups]
dev = [
    "dirty-equals==0.9.0",
    "pylint>=3.3.7",
    "pytest==8.3.3",
    "pytest-asyncio==0.23.5",
    "pytest-cov==6.1.1",
    "pytest-flakefinder",
    "pytest-report==0.2.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.6.1",
    "ruff",
    "pre-commit",
    "black==24.4",
    "mypy==1.10.0",
    "coverage==7.5",
    "bandit==1.7.5",
    "twine==6.1.0",
    "debugpy>=1.8.16",
]

[project.optional-dependencies]
tracing = [
  "opentelemetry-api==1.26.0",
  "opentelemetry-sdk==1.26.0",
  "opentelemetry-exporter-otlp==1.26.0",
]

[project.scripts]
mcp-composer = "mcp_composer.core.cli.cli_main:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
tag_pattern = "mcp_composer-v{version}"
default_version = "0.0.0"
# --- key bits to avoid "+<hash>" ---
style = "pep440"        # ensure PEP 440 shape
metadata = false        # DO NOT add local metadata (commit hash, dirty flag)
dirty = false           # belt & braces



# Wheel build (src-layout)
[tool.hatch.build.targets.wheel]
package-dir = {"" = "src"}
# Remove explicit packages list to auto-discover all packages
exclude = ["**/.venv/**", "**/__pycache__/**", "tests/**", "build/**", "dist/**", ".git/**"]

# Also exclude junk from sdist
[tool.hatch.build.targets.sdist]
exclude = ["**/.venv/**", "**/__pycache__/**", "build/**", "dist/**", ".git/**"]

# --- Tooling configs (unchanged) ---
[tool.pyright]
include = ["src", "test"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", ".git", "dist"]
venvPath = "."
venv = ".venv"

[tool.pylint.'MAIN']
ignore = ["venv", "migrations", "build"]
max-line-length = 120
disable = ["C0114", "C0115", "C0116"]

[tool.pylint.messages_control]
disable = ["missing-docstring", "invalid-name"]

[tool.ruff]
line-length = 120
exclude = ["venv", "migrations", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "build/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.coverage.run]
branch = true
source = ["src/mcp_composer"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true

[tool.mcp_composer]
tracing_enabled = false
tracing_protocol = "http"
tracing_endpoint = "http://localhost:4318"
service_name = "mcp-composer"
environment = "dev"
