servers:
  - id: "mcp-stock-info"
    type: "http"
    endpoint: "https://mcp-stock-info.1vgzmntiwjzl.eu-es.codeengine.appdomain.cloud/mcp"
    label: "Stock Information Service"
    tags: ["finance", "stocks"]

  - id: "mcp-server-fetch"
    type: "sse"
    endpoint: "https://mcp-server-fetch.1vgzmntiwjzl.eu-es.codeengine.appdomain.cloud/sse"
    label: "Data Fetching Service"
    tags: ["data", "fetch"]

middleware:
  - name: "PIIFilter"
    version: "0.0.0"
    kind: "mcp_composer.middleware.pii_middleware.SecretsAndPIIMiddleware"
    mode: "enabled"
    priority: 10
    applied_hooks:
      - "on_call_tool"
      - "on_read_resource"
      - "on_list_prompts"
    config:
      redact_inputs: true
      redact_outputs: true
      strategy:
        mode: "mask"
        redaction_text: "[PII_REDACTED]"

  - name: "RateLimiter"
    kind: "mcp_composer.middleware.rate_limit_filter.RateLimitingMiddleware"
    mode: "enabled"
    priority: 20
    applied_hooks:
      - "on_call_tool"
    config:
      requests_per_minute: 120
      burst_limit: 20

prompts:
  - name: "app_top_errors_yesterday"
    description: "Show top erroneous calls handled by an application since yesterday"
    template: "Show top erroneous calls handled by '{{ application }}' application since yesterday"
    arguments:
      - name: "application"
        type: "string"
        required: true
        description: "The name of the application"

  - name: "hup_calls_perf_2h"
    description: "Show performance overview of all hup calls in the past 2 hours grouped by call name"
    template: "Show performance overview of all hup calls in the past 2 hours group by call name"

resources:
  # Static resources
  - name: "system_info"
    description: "System information and status"
    uri: "resource://system/info"
    text: |
      System: MCP Composer
      Version: 1.0.0
      Status: Active
    mime_type: "text/plain"
    tags: ["system", "info"]

  - name: "guidelines"
    description: "Development guidelines"
    uri: "resource://docs/guidelines"
    text: |
      # Development Guidelines
      
      ## Code Style
      - Follow PEP 8 for Python code
      - Use type hints
      - Write docstrings
      
      ## Testing
      - Write unit tests
      - Maintain >80% coverage
    mime_type: "text/markdown"
    tags: ["docs", "guidelines"]

  # Resource templates
  - name: "project_template"
    description: "Project information template"
    uri_template: "resource://projects/{project_id}"
    template: |
      Project ID: {project_id}
      Status: Active
      Last Updated: 2024-01-01
    mime_type: "text/plain"
    tags: ["project", "template"]
    parameters:
      project_id:
        type: "string"
        required: true
        description: "Project identifier"

  - name: "user_data"
    description: "User data template"
    uri_template: "resource://users/{user_id}/data"
    template: "User data for {user_id}"
    mime_type: "application/json"
    tags: ["user", "data"]
    parameters:
      user_id:
        type: "string"
        required: true
        description: "User ID"

tools:
  openapi_input:
    openapi: "3.0.3"
    info:
      title: "HelloWorld_API"
      description: "A simple API with one endpoint"
      version: "1.0.0"
    servers:
      - url: "https://www.api.example.com/v1"
    paths:
      "/hello":
        get:
          summary: "Returns a greeting message"
          responses:
            "200":
              description: "Successful response"
              content:
                application/json:
                  schema:
                    type: "object"
                    properties:
                      message:
                        type: "string"
                        example: "Hello, world!"
          operationId: "get greeting"

  jsonplaceholder_api:
    name: "jsonplaceholder_api"
    tool_type: "curl"
    description: "Fetch posts from JSONPlaceholder API using curl"
    curl_config:
      value: "curl -X GET 'https://jsonplaceholder.typicode.com/posts/1' -H 'Accept: application/json'"

