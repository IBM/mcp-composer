[project]
name = "mcp-composer"
version = "0.1.0.2"
description = "FastMCP-based MCP Server Orchestrator"
readme = "PACKAGE.md"
requires-python = ">=3.11"
dependencies = [
    "duckduckgo-search>=8.0.1",
    "fastmcp==2.11.2",
    "requests==2.32.4",
    "httpx==0.28.1",
    "ibmcloudant==0.10.2",
    "ibm-cloud-sdk-core==3.23.0",
    "fastapi==0.116.1",
    "aiohttp==3.12.14",
    "dotenv>=0.9.9",
    "jsonschema>=4.24.0",
    "uncurl==0.0.11",
    "chromadb>=1.0.15",
    "acp-sdk==1.0.0",
    "sentence-transformers>=5.0.0",
    "np>=1.0.2",
    "hnswlib>=0.8.0",
    "ollama>=0.5.1",
    "ibm-secrets-manager-sdk==2.1.10",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "hvac==2.3.0",
    "beeai-framework==0.1.34",
    "types-requests>=2.32.4.20250611",
]

[dependency-groups]
dev = [
    "dirty-equals==0.9.0",
    "pylint>=3.3.7",
    "pytest==8.3.3",
    "pytest-asyncio==0.23.5",
    "pytest-cov==6.1.1",
    "pytest-flakefinder",
    "pytest-report==0.2.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.6.1",
    "ruff",
    "pre-commit",
    "black==24.4",
    "mypy==1.10.0",
    "coverage==7.5",
    "bandit==1.7.5",
]

[project.optional-dependencies]
tracing = [
  "opentelemetry-api==1.26.0",
  "opentelemetry-sdk==1.26.0",
  "opentelemetry-exporter-otlp==1.26.0",
]


[tool.pyright]
include = ["src", "test"]
exclude = ["**/node_modules", "**/__pycache__", ".venv", ".git", "dist"]
venvPath = "."
venv = ".venv"


[tool.pylint.'MAIN']
# Example options:
ignore = ["venv", "migrations", "build"]
max-line-length = 120
disable = ["C0114", "C0115", "C0116"]  # Example: disables missing docstring warnings

[tool.pylint.messages_control]
# Enable/disable specific messages
disable = ["missing-docstring", "invalid-name"]


[tool.ruff]
line-length = 120
exclude = ["venv", "migrations", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W"]  # Which error codes to check
ignore = ["E501", "F401"]  # Example: ignore line length errors


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "build/"]


[tool.coverage.run]
branch = true
source = ["src/mcp_composer"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 85
show_missing = true

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mcp_composer", "mcp_composer.core", "mcp_composer.core.settings", 
            "mcp_composer.core.auth_handler", "mcp_composer.core.member_servers",
            "mcp_composer.core.utils", "mcp_composer.core.middleware",
            "mcp_composer.core.models", "mcp_composer.core.resources",
            "mcp_composer.core.tools", "mcp_composer.core.prompts",
             "mcp_composer.middleware", "mcp_composer.features","mcp_composer.store"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
    "test",
]

[tool.mcp_composer]
# default feature flags (can be overridden by env)
tracing_enabled = false
tracing_protocol = "http"   # "http" | "grpc"
tracing_endpoint = "http://localhost:4318"
service_name = "mcp-composer"
environment = "dev"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
mcp-composer = "mcp_composer.core.utils.cli:main"
