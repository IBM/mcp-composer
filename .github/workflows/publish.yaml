name: Publish on new release

on:
  release:
    types: [published]
jobs:
  sdk:
    name: 'mcp-composer release'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-python@v5'
        with:
          python-version: '3.8'
      - name: build
        run: |
          # this SDK is intended for general use so should run on as many python versions as possible.
           ./scripts/build_wheel.sh
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.whl